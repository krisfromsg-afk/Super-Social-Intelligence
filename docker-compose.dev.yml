name: ssi-dev

include:
  - docker-compose.yml

x-service-common: &service-common
  platform: linux/amd64
  restart: unless-stopped
  env_file:
    - ./.env
  # Container DNS differs from the localhost URLs in the host-side .env.
  environment: &internal-service-endpoints
    DATABASE_URL: "postgresql://${POSTGRES_USER:-chatbotx}:${POSTGRES_PASSWORD:?Run pnpm ssi:bootstrap first}@postgres:5432/${POSTGRES_DB:-chatbotx}?schema=public"
    REDIS_URL: "redis://redis:6379"
    S3_ENDPOINT: "http://filesystem:9000"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - chatbotx-network

x-worker-common: &worker-common
  <<: *service-common
  build:
    context: .
    dockerfile: apps/worker/docker/Dockerfile

services:
  builder:
    <<: *service-common
    # image: chatbotx-builder:latest
    build:
      context: .
      dockerfile: apps/builder/docker/Dockerfile
    ports:
      - "127.0.0.1:3123:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      filesystem:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      <<: *internal-service-endpoints
      RUN_DB_MIGRATE: "true"
      RUN_DB_SEED: "false"
      REALTIME_INTERNAL_URL: "http://realtime:1999"

  # BullMQ Worker
  worker:
    <<: *worker-common
    networks:
      - chatbotx-network
      - javascript-executor-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      filesystem:
        condition: service_healthy
      javascript-executor:
        condition: service_healthy
    environment:
      <<: *internal-service-endpoints
      JAVASCRIPT_EXECUTOR_URL: "http://javascript-executor:3210"
      REALTIME_INTERNAL_URL: "http://realtime:1999"

  javascript-executor:
    platform: linux/amd64
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/javascript-executor/docker/Dockerfile
    environment:
      JAVASCRIPT_EXECUTOR_TOKEN: ${JAVASCRIPT_EXECUTOR_TOKEN:?Run pnpm ssi:bootstrap first}
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-2}
    networks:
      - javascript-executor-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    pids_limit: 128
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
          pids: 128
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  realtime:
    <<: *service-common
    environment:
      <<: *internal-service-endpoints
      # Server-side origin validation must reach the builder on Docker DNS.
      NEXT_PUBLIC_BUILDER_URL: "http://builder:3000"
    build:
      context: .
      dockerfile: apps/realtime/docker/Dockerfile
    ports:
      - "127.0.0.1:1999:1999"

networks:
  javascript-executor-network:
    driver: bridge
    internal: true
