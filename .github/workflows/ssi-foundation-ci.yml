name: SSI Foundation CI

on:
  push:
    branches: [feat/ssi-foundation-rebrand, 'feat/ssi-*']
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'integrations/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/ssi-foundation-ci.yml'
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify MIT source boundary
        shell: bash
        run: |
          test ! -e apps/builder/src/enterprise
          test -f LICENSE
          grep -q 'Copyright (c) 2024-present AhaChat LLC' LICENSE
          test -f packages/ai/package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify SSI sender classification unit tests
        run: pnpm --filter builder exec vitest run src/features/ssi-inbox/__tests__/message-provenance.test.ts
      - name: Verify permanent Human Only state
        run: pnpm --filter builder exec vitest run src/features/ssi-inbox/__tests__/human-only.test.ts
      - name: Check types (builder)
        run: pnpm --filter builder check-types
      - name: Build builder
        run: pnpm --filter builder build
