name: SSI Workspace Snapshot (Disposable)

# Read-only, tracked source only. Allows offline development/debugging through
# the GitHub artifact API without cloning with stored credentials. No secrets,
# dependency cache, .git directory or untracked runtime data is collected.
on:
  workflow_dispatch:
  push:
    branches: [feat/ssi-clean-history-rebuild]
    paths: [.github/workflows/ssi-workspace-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact tracked source revision
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/ssi-source-revision.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/ssi-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: ssi-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ssi-source.tar.gz
            ${{ runner.temp }}/ssi-source-revision.txt
          retention-days: 1
          if-no-files-found: error
